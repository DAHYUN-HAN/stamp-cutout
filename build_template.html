<title>우표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&display=swap">
<style>
:root{
  --ground:#DBD8D0; --btn:#F4F3EF; --ink:#1A1A17; --soft:#75746D; --line:#BFBCB3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121311; --btn:#1E201D; --ink:#E9E8E2; --soft:#8A8B84; --line:#33352F;
  }
}
:root[data-theme="dark"]{
  --ground:#121311; --btn:#1E201D; --ink:#E9E8E2; --soft:#8A8B84; --line:#33352F;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);
  font-family:"Archivo","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}

.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:16px}

.stage{position:relative;aspect-ratio:3/4;
  width:min(100%,calc((100dvh - 132px) * 0.75),480px)}
canvas{width:100%;height:100%;display:block;box-shadow:0 1px 2px rgba(0,0,0,.18),0 20px 40px -26px rgba(0,0,0,.55)}
.overlay{position:absolute;inset:0;touch-action:none;cursor:grab}
.overlay.dragging{cursor:grabbing}
.overlay.empty{cursor:pointer}
.overlay.dropping{outline:2px dashed var(--soft);outline-offset:4px}

.bar{display:flex;gap:8px;width:min(100%,420px)}
/* 글자 폭을 기준으로 잡고 남는 공간만 나눠 가진다 — 좁은 화면에서도 줄바꿈 없이 */
button{flex:1 1 auto;font:inherit;font-size:15px;font-weight:500;padding:13px 10px;border-radius:4px;
  white-space:nowrap;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer}
button#center{font-size:13.5px}
button.go{flex-grow:1.6}
button:hover:not(:disabled){border-color:var(--soft)}
button:active:not(:disabled){transform:translateY(1px)}
button.go{background:var(--ink);border-color:var(--ink);color:var(--ground)}
button.go:hover{filter:brightness(1.15)}
button:disabled{opacity:.45;cursor:default;transform:none}
:focus-visible{outline:2px solid var(--soft);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
  color:var(--ground);padding:11px 18px;border-radius:4px;font-size:14px;z-index:40}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="out" width="750" height="1000" aria-label="미리보기"></canvas>
    <div class="overlay empty" id="ov"></div>
  </div>
  <div class="bar">
    <button id="pick" type="button">사진 업로드</button>
    <button id="center" type="button">우표 위치 초기화</button>
    <button id="save" type="button" class="go">저장</button>
  </div>
  <input id="file" type="file" accept="image/*" class="sr">
</div>

<script>
(() => {
  const W = 1560, H = 2080, F = H / 2, BH = H - F;   // 3 : 4, 위/아래 칸은 세로 정확히 절반씩
  const SW = 498, SH = 360;                          // 우표 크기 고정

  const cv = document.getElementById('out');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const ov = document.getElementById('ov');
  const fileEl = document.getElementById('file');
  const centerBtn = document.getElementById('center');

  const CX = (W - SW) / 2, CY = (BH - SH) / 2;       // 우표 기본 자리
  let stamp = { x: CX, y: CY };
  let img = null, bg = null, ph = { ox: 0, oy: 0, s: 1, s0: 1 };

  /* 우표 외곽선 — 톱니 반지름 : 간격 : 여백 = 10 : 25 : 17 (원본 SVG 234 단위 기준) */
  function edge(L, r) {
    let n = Math.max(2, Math.round((L - 0.9 * r) / (4.5 * r)));
    let g = (L - 2 * r * n) / (n + 0.36);
    while (n > 2 && g < r * 0.5) { n--; g = (L - 2 * r * n) / (n + 0.36); }
    return { n, e: 0.68 * g, p: 2 * r + g };
  }
  const R = Math.min(SW, SH) * (10 / 234);
  const T = edge(SW, R), S = edge(SH, R);
  function stampPath(c, x, y) {
    c.beginPath();
    c.moveTo(x, y);
    for (let i = 0; i < T.n; i++) { const a = x + T.e + i * T.p; c.lineTo(a, y); c.arc(a + R, y, R, Math.PI, 0, true); }
    c.lineTo(x + SW, y);
    for (let i = 0; i < S.n; i++) { const b = y + S.e + i * S.p; c.lineTo(x + SW, b); c.arc(x + SW, b + R, R, -Math.PI / 2, Math.PI / 2, true); }
    c.lineTo(x + SW, y + SH);
    for (let i = 0; i < T.n; i++) { const a = x + SW - T.e - i * T.p; c.lineTo(a, y + SH); c.arc(a - R, y + SH, R, 0, Math.PI, true); }
    c.lineTo(x, y + SH);
    for (let i = 0; i < S.n; i++) { const b = y + SH - S.e - i * S.p; c.lineTo(x, b); c.arc(x, b - R, R, Math.PI / 2, -Math.PI / 2, true); }
    c.closePath();
  }

  /* 빈 화면 안내용 사진 아이콘 */
  function photoIcon(c, cx, cy, w) {
    const h = w * 0.78, x = cx - w / 2, y = cy - h / 2, r = w * 0.10;
    c.lineWidth = w * 0.062; c.lineJoin = 'round'; c.lineCap = 'round';
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath(); c.stroke();
    c.beginPath();
    c.arc(x + w * 0.29, y + h * 0.30, w * 0.062, 0, Math.PI * 2); c.stroke();
    c.beginPath();
    c.moveTo(x + w * 0.11, y + h * 0.79);
    c.lineTo(x + w * 0.38, y + h * 0.46);
    c.lineTo(x + w * 0.58, y + h * 0.69);
    c.lineTo(x + w * 0.69, y + h * 0.57);
    c.lineTo(x + w * 0.89, y + h * 0.79);
    c.stroke();
  }

  /* 합성 */
  const layer = document.createElement('canvas');
  function render(c, k) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, W * k, H * k);
    c.setTransform(k, 0, 0, k, 0, 0);
    c.imageSmoothingQuality = 'high';

    if (bg) {                                        // 배경지를 캔버스에 꽉 차게
      const b = Math.max(W / bg.width, H / bg.height);
      c.drawImage(bg, (W - bg.width * b) / 2, (H - bg.height * b) / 2, bg.width * b, bg.height * b);
    } else { c.fillStyle = '#FCF8EE'; c.fillRect(0, 0, W, H); }

    if (!img) {                                      // 사진 넣기 전 — 아래 칸은 흰 바탕
      c.fillStyle = '#FFFFFF';
      c.fillRect(0, F, W, BH);
      c.lineWidth = 4;
      c.strokeStyle = 'rgba(30,28,24,.16)';          // 위: 조각이 놓일 자리
      stampPath(c, stamp.x, stamp.y); c.stroke();
      c.strokeStyle = 'rgba(30,28,24,.30)';          // 아래: 구멍이 뚫릴 자리
      stampPath(c, stamp.x, F + stamp.y); c.stroke();
      c.strokeStyle = 'rgba(30,28,24,.34)';
      photoIcon(c, stamp.x + SW / 2, F + stamp.y + SH / 2, Math.min(SW, SH) * 0.34);
      c.setTransform(1, 0, 0, 1, 0, 0);
      return;
    }

    const iw = img.width * ph.s, ih = img.height * ph.s;

    // 아래 칸 — 사진에서 우표 모양을 오려낸다
    const fy = Math.round(F * k);
    layer.width = Math.round(W * k); layer.height = Math.round(H * k) - fy;
    const lc = layer.getContext('2d');
    lc.setTransform(k, 0, 0, k, 0, 0);
    lc.imageSmoothingQuality = 'high';
    lc.drawImage(img, ph.ox, ph.oy, iw, ih);
    lc.globalCompositeOperation = 'destination-out';
    stampPath(lc, stamp.x, stamp.y);
    lc.fill();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.drawImage(layer, 0, fy);

    // 위 칸 — 오려낸 조각을 같은 자리에 붙인다 (위 칸 원점 = 캔버스 원점)
    c.setTransform(k, 0, 0, k, 0, 0);
    c.save();
    stampPath(c, stamp.x, stamp.y);
    c.clip();
    c.drawImage(img, ph.ox, ph.oy, iw, ih);
    c.restore();
    c.setTransform(1, 0, 0, 1, 0, 0);
  }

  /* 미리보기 */
  let queued = false;
  function paint() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const bw = Math.max(300, Math.round(stage.getBoundingClientRect().width * dpr));
      if (cv.width !== bw) { cv.width = bw; cv.height = Math.round(bw * H / W); }
      render(ctx, cv.width / W);
      // 우표가 기본 자리에 있으면 되돌릴 것이 없다
      centerBtn.disabled = Math.abs(stamp.x - CX) < 0.5 && Math.abs(stamp.y - CY) < 0.5;
    });
  }
  new ResizeObserver(paint).observe(stage);

  /* 상태 */
  function fit() {
    ph.s0 = Math.max(W / img.width, BH / img.height);
    ph.s = ph.s0;
    ph.ox = (W - img.width * ph.s) / 2;
    ph.oy = (BH - img.height * ph.s) / 2;
  }
  function clampPhoto() {
    ph.s = Math.max(ph.s0, Math.min(ph.s, ph.s0 * 8));
    ph.ox = Math.min(0, Math.max(W - img.width * ph.s, ph.ox));
    ph.oy = Math.min(0, Math.max(BH - img.height * ph.s, ph.oy));
  }
  function clampStamp() {
    stamp.x = Math.max(0, Math.min(stamp.x, W - SW));
    stamp.y = Math.max(0, Math.min(stamp.y, BH - SH));
  }

  /* 입력 — 우표 안을 끌면 우표 이동, 밖을 끌면 사진 이동, 두 손가락은 사진 확대 */
  const pts = new Map();
  let mode = null, pinch = null, last = null;

  const toCv = e => {
    const r = stage.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  };

  ov.addEventListener('pointerdown', e => {
    if (!img) { fileEl.click(); return; }
    ov.setPointerCapture(e.pointerId);
    const p = toCv(e);
    pts.set(e.pointerId, p);
    if (pts.size === 2) {
      const v = [...pts.values()];
      pinch = { d: Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y), s: ph.s,
                m: { x: (v[0].x + v[1].x) / 2, y: (v[0].y + v[1].y) / 2 - F } };
      mode = 'pinch';
      return;
    }
    const ly = p.y - F;
    mode = (p.x >= stamp.x && p.x <= stamp.x + SW && ly >= stamp.y && ly <= stamp.y + SH) ? 'move' : 'pan';
    last = { x: p.x, y: ly };
    ov.classList.add('dragging');
  });

  ov.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId) || !img) return;
    const p = toCv(e);
    pts.set(e.pointerId, p);
    if (mode === 'pinch' && pts.size === 2) {
      const v = [...pts.values()];
      const d = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y);
      if (pinch.d > 4) {
        const ns = Math.max(ph.s0, Math.min(pinch.s * d / pinch.d, ph.s0 * 8));
        ph.ox = pinch.m.x - (pinch.m.x - ph.ox) * (ns / ph.s);
        ph.oy = pinch.m.y - (pinch.m.y - ph.oy) * (ns / ph.s);
        ph.s = ns; clampPhoto(); paint();
      }
      return;
    }
    if (!mode || !last) return;
    const ly = p.y - F, dx = p.x - last.x, dy = ly - last.y;
    if (mode === 'move') { stamp.x += dx; stamp.y += dy; clampStamp(); }
    else { ph.ox += dx; ph.oy += dy; clampPhoto(); }
    last = { x: p.x, y: ly };
    paint();
  });

  const up = e => {
    pts.delete(e.pointerId);
    if (pts.size === 0) { mode = null; last = null; ov.classList.remove('dragging'); }
    else if (mode === 'pinch') { const p = [...pts.values()][0]; mode = 'pan'; last = { x: p.x, y: p.y - F }; }
  };
  ov.addEventListener('pointerup', up);
  ov.addEventListener('pointercancel', up);

  ov.addEventListener('wheel', e => {
    if (!img) return;
    e.preventDefault();
    const p = toCv(e), m = { x: p.x, y: p.y - F };
    const ns = Math.max(ph.s0, Math.min(ph.s * Math.pow(0.9985, e.deltaY), ph.s0 * 8));
    ph.ox = m.x - (m.x - ph.ox) * (ns / ph.s);
    ph.oy = m.y - (m.y - ph.oy) * (ns / ph.s);
    ph.s = ns; clampPhoto(); paint();
  }, { passive: false });

  ['dragenter', 'dragover'].forEach(t => ov.addEventListener(t, e => { e.preventDefault(); ov.classList.add('dropping'); }));
  ['dragleave', 'drop'].forEach(t => ov.addEventListener(t, e => { e.preventDefault(); ov.classList.remove('dropping'); }));
  ov.addEventListener('drop', e => takeFirst(e.dataTransfer.files));

  /* 사진 불러오기 · 우표 되돌리기 */
  document.getElementById('pick').onclick = () => fileEl.click();
  centerBtn.onclick = () => { stamp = { x: CX, y: CY }; paint(); };
  fileEl.onchange = () => { takeFirst(fileEl.files); fileEl.value = ''; };

  // 사진은 한 장만 쓴다. 고르는 화면은 기기가 그리는 것이라 여러 장이
  // 넘어올 수 있는데, 그때는 조용히 버리지 않고 알려준다.
  function takeFirst(files) {
    if (!files || !files.length) return;
    if (files.length > 1) toast('사진은 한 장만 쓸 수 있어서 첫 번째 것을 넣었어요.');
    load(files[0]);
  }

  async function load(file) {
    try {
      if (window.createImageBitmap) {
        try { img = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
        catch (_) { img = await viaTag(URL.createObjectURL(file)); }
      } else { img = await viaTag(URL.createObjectURL(file)); }
      fit();
      ov.classList.remove('empty');
      paint();
    } catch (_) { toast('이 파일은 열 수 없어요.'); }
  }
  function viaTag(src) {
    return new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i); i.onerror = rej; i.src = src;
    });
  }

  /* 저장 */
  let dl = null;
  if (window.claude && window.claude.use) {          // 클로드 아티팩트로 열었을 때만
    window.claude.use('downloads').then(d => { dl = d; }).catch(() => {});
  }
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }
  /* 파일 내려받기 — 앵커를 문서에 붙였다 눌러야 모바일에서 동작한다 */
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 30000);
  }

  const saveBtn = document.getElementById('save');
  saveBtn.onclick = async () => {
    if (!img) { toast('먼저 사진을 넣어주세요.'); return; }
    saveBtn.disabled = true;
    try {
      const ex = document.createElement('canvas');
      ex.width = W; ex.height = H;
      render(ex.getContext('2d'), 1);
      const blob = await new Promise(r => ex.toBlob(r, 'image/jpeg', 0.94));
      const d = new Date(), z = n => String(n).padStart(2, '0');
      const name = 'stamp-' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) +
                   '-' + z(d.getHours()) + z(d.getMinutes()) + '.jpg';

      if (dl) {                                      // 클로드 아티팩트로 열었을 때
        try { await dl.save({ filename: name, data: blob }); return; }
        catch (err) { if (err && err.code === 'declined') return; }
      }
      download(blob, name);
    } catch (_) {
      toast('저장하지 못했어요. 다시 눌러주세요.');
    } finally { saveBtn.disabled = false; }
  };

  /* 시작 */
  viaTag('data:image/jpeg;base64,__BG_B64__').then(b => { bg = b; paint(); });
  paint();
})();
</script>
